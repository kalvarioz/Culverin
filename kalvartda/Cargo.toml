[package]
name = "tda-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.32"
ndarray = "0.15"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
pyo3 = { version = "0.19", features = ["extension-module"] }

[lib]
name = "tda_engine"
crate-type = ["cdylib", "rlib"]